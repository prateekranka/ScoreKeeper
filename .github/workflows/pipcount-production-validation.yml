name: PipCount Production Validation

on:
  push:
    branches:
      - app-dev/pipcount-bauhaus-motion
  pull_request:
    branches:
      - app-dev/pipcount-bauhaus-motion
      - main

concurrency:
  group: pipcount-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.device }}
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            destination: generic/platform=iOS Simulator
          - device: iPad
            destination: generic/platform=iOS Simulator

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -resolvePackageDependencies

      - name: Build ${{ matrix.device }} production UI
        run: |
          set -o pipefail
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/PipCount-${{ matrix.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PipCount-${{ matrix.device }}-build-logs
          path: |
            ${{ runner.temp }}/PipCount-${{ matrix.device }}/Logs
          if-no-files-found: ignore
          retention-days: 7
