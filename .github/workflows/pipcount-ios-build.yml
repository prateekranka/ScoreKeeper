name: PipCount iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipcount-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPhone and iPad app
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install acceptance tools
        run: |
          npm ci
          brew install mobai-app/tap/simslim

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate production redesign
        run: python3 scripts/validate_pipcount_redesign.py

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -resolvePackageDependencies

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PipCountDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Accept iPhone
        run: python3 scripts/run_native_acceptance.py --devices iphone --app "$RUNNER_TEMP/PipCountDerivedData/Build/Products/Debug-iphonesimulator/ScoreKeeper.app" --output .e2e-ci/iphone-run
        env:
          DO_NOT_TRACK: '1'

      - name: Accept iPad after iPhone
        run: python3 scripts/run_native_acceptance.py --devices ipad --app "$RUNNER_TEMP/PipCountDerivedData/Build/Products/Debug-iphonesimulator/ScoreKeeper.app" --output .e2e-ci/ipad-run
        env:
          DO_NOT_TRACK: '1'

      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipcount-native-acceptance
          path: .e2e-ci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
