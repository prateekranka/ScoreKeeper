name: PipCount iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - app-dev/pipcount-bauhaus-motion
  pull_request:
    branches:
      - main
      - claude/show-claude-md-0Z8wn
      - app-dev/pipcount-bauhaus-motion

concurrency:
  group: pipcount-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPhone and iPad app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate production redesign
        run: python3 scripts/validate_pipcount_redesign.py

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -resolvePackageDependencies

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ScoreKeeper.xcodeproj \
            -scheme ScoreKeeper \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/PipCountDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch on iPhone and iPad simulators
        run: bash scripts/smoke_simulators.sh

      - name: Upload light-mode simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipcount-light-mode-simulator-evidence
          path: build-evidence/*.png
          if-no-files-found: error
          retention-days: 14
