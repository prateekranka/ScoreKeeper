name: PipCount Design System Lint

# Fails the pull request when new code breaks a design-system rule
# in .swiftlint.yml. Old code in .swiftlint-baseline.json does not fail.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pipcount-design-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Design system rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.65.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json --reporter github-actions-logging
