<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipCount · round deck prototype</title>
<style>
:root{
  color-scheme:light;
  --paper:#f0f0e4;--slip:#fcf6f0;--sunken:#e9e5d8;--ink:#171712;--muted:#756f63;--rule:#cfc8ba;
  --blue:#0036a8;--red:#de181e;--yellow:#fcb412;--green:#008a42;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.3 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#d8d5cb;color:var(--ink)}
button,input{font:inherit}
.stage{min-height:100vh;display:grid;place-items:center;padding:86px 20px 34px}
.phone{position:relative;width:min(430px,calc(100vw - 24px));height:min(880px,calc(100vh - 116px));min-height:700px;overflow:hidden;border:9px solid #111;border-radius:48px;background:var(--paper);box-shadow:0 28px 70px rgba(0,0,0,.25)}
.status{height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px 8px;font-size:12px;font-weight:750}
.island{position:absolute;top:12px;left:50%;width:116px;height:30px;transform:translateX(-50%);border-radius:20px;background:#111}
.screen{height:calc(100% - 46px);display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 18px 10px}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.title{margin:2px 0 0;font-family:"Arial Black","Futura",Inter,sans-serif;font-size:30px;line-height:.96;letter-spacing:-.045em}
.round-mark{border:1px solid var(--ink);padding:7px 9px;font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;transform:rotate(2deg);background:var(--slip)}
.paper{background:var(--slip);border:1.5px solid var(--ink);box-shadow:4px 5px 0 rgba(23,23,18,.09)}
.shape{display:inline-block;flex:none}
.circle{border-radius:50%}.square{}.triangle{width:0!important;height:0!important;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid var(--yellow);background:transparent!important}.diamond{transform:rotate(45deg) scale(.72)}
.blue{background:var(--blue)}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}
.score-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;font:inherit}
button:active{transform:scale(.97)}
.deck-open-btn{display:block;width:calc(100% - 36px);margin:14px auto 8px;min-height:64px;background:var(--blue);color:#fff;font-weight:850;font-size:18px;border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.totals{margin:0 18px 10px;padding:4px 0}
.totals-head{padding:8px 12px;border-bottom:1.5px solid var(--ink);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;display:flex;justify-content:space-between}
.total-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--rule)}
.total-row .shape{width:22px;height:22px;border:1px solid var(--ink)}
.total-row b{font-size:15px;margin-right:auto}
.total-row small{color:var(--muted);font-size:11px;margin-right:8px}
.total-row .last{font:800 16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue)}
.history-strip{margin:0 18px 12px;padding:10px 12px;font-size:11px;color:var(--muted)}
.action-shelf{margin-top:auto;padding:10px 18px 24px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule)}
.shelf-btn{min-height:44px;padding:0 14px;background:var(--slip);border:1.5px solid var(--ink);font-weight:720;color:var(--ink)}

/* Deck overlay */
.deck-backdrop{position:absolute;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity 200ms var(--ease-out);z-index:10}
.screen[data-deck] .deck-backdrop{opacity:1;pointer-events:auto}

.deck{position:absolute;inset:0;z-index:11;display:none;flex-direction:column;padding:56px 20px 30px}
.screen[data-deck] .deck{display:flex;animation:sheet-in 280ms var(--ease-out)}
@keyframes sheet-in{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.deck{animation-duration:1ms}.card-anim{animation:none !important}}

.deck-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.deck-progress{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.deck-close{background:transparent;border:1.5px solid var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;line-height:1}

.card-stack{position:relative;flex:1;perspective:1200px}
.pcard{position:absolute;inset:0;background:var(--slip);border:1.5px solid var(--ink);box-shadow:5px 6px 0 rgba(23,23,18,.1);padding:16px;display:flex;flex-direction:column;transform-origin:center bottom;transition:transform 260ms var(--ease-out),opacity 260ms var(--ease-out),filter 260ms var(--ease-out)}
.pcard[data-state="active"]{z-index:3;transform:none;opacity:1}
.pcard[data-state="next"]{z-index:2;transform:translateY(14px) scale(.96) rotate(.6deg);opacity:.65;filter:brightness(.97)}
.pcard[data-state="far"]{z-index:1;transform:translateY(26px) scale(.92) rotate(-.5deg);opacity:.35;filter:brightness(.94)}
.pcard[data-state="gone-left"]{z-index:4;transform:translateX(-110%) rotate(-6deg);opacity:0;pointer-events:none}
.pcard[data-state="dragging"]{transition:none;z-index:5}

.pcard-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pcard-head .shape{width:34px;height:34px;border:1.5px solid var(--ink)}
.pcard-head b{font-size:21px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-head small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}

.pcanvas-wrap{position:relative;flex:1;background:white;border:1.5px solid var(--ink);overflow:hidden;touch-action:none;cursor:crosshair}
.pcanvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.pcanvas-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:14px;pointer-events:none;transition:opacity 180ms var(--ease-out);line-height:1.5}
.pcanvas-hint.hidden{opacity:0}
.pcanvas-hint strong{display:block;font-family:"Arial Black","Futura",sans-serif;font-size:19px;color:var(--ink);margin-bottom:4px;letter-spacing:-.02em}

.pcard-foot{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;margin-top:10px}
.preadout{display:grid;place-items:center;min-width:74px;height:52px;border:1.5px solid var(--ink);background:white;font:900 27px ui-monospace,SFMono-Regular,Menlo,monospace}
.preadout.flash{animation:rd-flash 240ms var(--ease-out)}
@keyframes rd-flash{0%{background:var(--yellow)}100%{background:white}}
.pbtn{min-width:48px;min-height:48px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:19px;background:var(--sunken);font-weight:800}
.pbtn.accept{background:var(--green);color:#fff}
/* confirm overlay */
.confirm-overlay{position:absolute;inset:0;background:rgba(252,246,240,.96);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;padding:14px}
.pcanvas-wrap[data-confirming] .confirm-overlay{display:flex;animation:ov-in 200ms var(--ease-out)}
@keyframes ov-in{0%{opacity:0}100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.pcanvas-wrap[data-confirming] .confirm-overlay{animation:none}}
.confirm-num{font-size:min(120px,18vw);line-height:1;font-weight:900;color:var(--ink)}
.confirm-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.11em;font-weight:800;margin-top:4px}
.confirm-actions{display:flex;gap:9px;margin-top:16px}
.confirm-retry,.confirm-ok{min-width:58px;min-height:58px;border:1.5px solid var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:14px}
.confirm-retry{background:var(--sunken);color:var(--ink)}
.confirm-ok{background:var(--green);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.confirm-actions button:active{transform:scale(.94)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.deck-dots{display:flex;justify-content:center;gap:7px;padding:12px 0 0}
.ddot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);transition:background 160ms var(--ease-out)}
.ddot[data-on]{background:var(--blue)}
.ddot[data-done]{background:var(--green);border-color:var(--green)}

.deck-swipe-hint{position:absolute;top:50%;right:10px;transform:translateY(-50%);color:var(--muted);font-size:11px;font-weight:750;writing-mode:vertical-rl;letter-spacing:.06em;pointer-events:none;animation:nudge 1800ms ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(-5px)}}
@media(prefers-reduced-motion:reduce){.deck-swipe-hint{animation:none}}

/* tutorial coach marks */
.coach{position:absolute;inset:0;z-index:30;background:rgba(23,23,18,.72);display:none;place-items:center;padding:26px}
.screen[data-coach]{display:grid}
.coach-bubble{background:var(--slip);border:1.5px solid var(--ink);box-shadow:5px 6px 0 rgba(0,0,0,.3);padding:18px;max-width:330px;animation:coach-in 260ms var(--ease-out)}
@keyframes coach-in{0%{opacity:0;transform:translateY(12px) scale(.97)}100%{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.coach-bubble{animation:none}}
.coach-bubble h4{margin:0 0 8px;font-family:"Arial Black","Futura",sans-serif;font-size:18px;letter-spacing:-.02em}
.coach-bubble p{margin:0 0 14px;font-size:13px;line-height:1.55;color:var(--muted)}
.coach-bubble p strong{color:var(--ink)}
.coach-step{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue);letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}
.coach-actions{display:flex;justify-content:space-between;align-items:center}
.coach-skip{background:transparent;color:var(--muted);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer}
.coach-next{min-height:42px;padding:0 18px;background:var(--blue);color:#fff;font-weight:820;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Deck + Coach</button>
  <button class="proto-picker-item">Deck only</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const people=[
 {name:'Mina',total:128,color:'red',shape:'circle',last:'+12'},
 {name:'Omar',total:116,color:'blue',shape:'square',last:'+0'},
 {name:'Jules',total:94,color:'yellow',shape:'triangle',last:'−5'},
 {name:'Kai',total:83,color:'green',shape:'diamond',last:'+0'}
];
const marker=p=>`<span class="shape ${p.shape} ${p.color}"></span>`;

function renderRest(){
 return `<div class="screen" id="scr">
  <div class="status"><span>9:41</span><span>▮▮▮ ⌁ ▰</span></div>
  <header class="topbar"><div><div class="eyebrow">Scoreboard · highest wins</div><h1 class="title">Round<br>4</h1></div><div class="round-mark">LIVE · 4 PLAYERS</div></header>
  <button class="deck-open-btn" data-open-deck>✎ &nbsp;Score Round</button>
  <section class="paper totals">
    <div class="totals-head"><span>Player · total</span><span>Last rd</span></div>
    ${people.map(p=>`<div class="total-row">${marker(p)}<b>${p.name}</b><small>Total ${p.total}</small><span class="last score-num">${p.last}</span></div>`).join('')}
  </section>
  <div class="history-strip paper">Round history strip (undo / log) lives here.</div>
  <div class="action-shelf">
    <button class="shelf-btn">↺ Undo</button>
    <button class="shelf-btn">☰ Round Log</button>
    <button class="shelf-btn" style="color:var(--red)">End Game</button>
  </div>
  ${renderDeck()}
  ${renderCoach()}
 </div>`;
}
function renderDeck(){
 return `
  <div class="deck-backdrop"></div>
  <div class="deck" role="dialog" aria-label="Score this round">
    <div class="deck-top">
      <span class="deck-progress" id="prog">1 of ${people.length}</span>
      <button class="deck-close" data-close title="Cancel">✕</button>
    </div>
    <div class="card-stack" id="stack">${people.map((p,i)=>cardHTML(p,i)).join('')}</div>
    <div class="deck-dots">${people.map((_,i)=>`<span class="ddot" data-dot="${i}" ${i===0?'data-on':''}></span>`).join('')}</div>
  </div>`;
}
function cardHTML(p,i){
 const last=i===people.length-1;
 return `<article class="pcard card-anim" data-card="${i}" data-state="${i===0?'active':i===1?'next':'far'}" ${last?'data-is-last':''}>
   ${i===0?'<div class="deck-swipe-hint">swipe ← to save &amp; next →</div>':''}
   <div class="pcard-head">${marker(p)}<b>${p.name}</b><small>Total ${p.total}</small></div>
   <div class="pcanvas-wrap" data-pcw="${i}"><canvas data-cv="${i}"></canvas>
     <div class="pcanvas-hint"><div><strong>Write ${p.name}'s points</strong>draw a number, then tap ✓</div></div>
     <div class="confirm-overlay" data-overlay="${i}">
       <div class="confirm-num score-num" data-confirm-num="${i}"></div>
       <div class="confirm-label">is this right?</div>
       <div class="confirm-actions">
         <button class="confirm-retry" data-retry="${i}" title="Try again"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 12 11 8"/></svg></button>
         <button class="confirm-ok" data-ok="${i}" title="Accept"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
       </div>
     </div>
   </div>
   <div class="pcard-foot">
     <span class="preadout score-num" data-ro="${i}">+0</span>
     <button class="pbtn" data-clear="${i}" title="Clear drawing">⌫</button>
     <button class="pbtn accept" data-accept="${i}" title="Recognize score">✓</button>
   </div>
 </article>`;
}
function renderCoach(){
 const steps=[
  {t:'Score the round',b:`Tap <strong>Score Round</strong> and one card per player appears. Draw their points with your finger — no keyboard needed.`},
  {t:'Tap ✓ to check',b:`When you're done drawing, tap the <strong>✓ button</strong>. Your written number appears large — confirm it or try again.`},
  {t:'Swipe to save &amp; advance',b:`Once accepted, <strong>swipe left</strong> to save that score and slide to the next player automatically. Swipe right to go back and fix anything.`},
 ];
 return `<div class="coach" id="coach">
   <div class="coach-bubble">
     <div class="coach-step" id="cstep">Step 1 of ${steps.length}</div>
     <h4 id="ctitle">${steps[0].t}</h4>
     <p id="cbody">${steps[0].b}</p>
     <div class="coach-actions">
       <button class="coach-skip" data-skip>Skip tour</button>
       <button class="coach-next" data-cnext>Got it →</button>
     </div>
   </div>
 </div>`;
}

function bind(root){
 const screen=root.querySelector('#scr');
 const stack=root.querySelector('#stack');
 const cards=[...root.querySelectorAll('.pcard')];
 const dots=[...root.querySelectorAll('.ddot')];
 const prog=root.querySelector('#prog');
 let idx=0;

 /* --- open/close --- */
 root.querySelector('[data-open-deck]').addEventListener('click',()=>{
   screen.setAttribute('data-deck','');
 });
 root.querySelector('[data-close]').addEventListener('click',()=>screen.removeAttribute('data-deck'));
 root.querySelector('.deck-backdrop').addEventListener('click',()=>screen.removeAttribute('data-deck'));

 function paint(){
   cards.forEach((c,i)=>{
     c.dataset.state=i===idx?'active':i===idx+1?'next':i<idx?'gone-left':'far';
   });
   dots.forEach((d,i)=>{d.removeAttribute('data-on');d.removeAttribute('data-done');if(i<idx)d.setAttribute('data-done','');else if(i===idx)d.setAttribute('data-on','');});
   prog.textContent=`${idx+1} of ${people.length}`;
 }
 function next(){
   if(idx<cards.length-1){idx++;paint();}
   else{screen.removeAttribute('data-deck');setTimeout(()=>{idx=0;paint()},250);}
 }

 /* --- canvas draw --- */
 cards.forEach((card,i)=>{
   const cv=card.querySelector('canvas');
   const wrap=cv.parentElement;
   const hint=card.querySelector('.pcanvas-hint');
   const ctx=cv.getContext('2d');
   function fit(){cv.width=wrap.clientWidth*2;cv.height=wrap.clientHeight*2;ctx.scale(2,2);ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#171712'}
   requestAnimationFrame(fit);
   new ResizeObserver(fit).observe(wrap);
   let drawing=false;
   const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]};
   wrap.addEventListener('pointerdown',e=>{
     // don't start a stroke if it's actually a horizontal swipe on the card edge
     drawing=true;hint.classList.add('hidden');
     cv.setPointerCapture?.(e.pointerId);
     const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);
   });
   wrap.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
   ['pointerup','pointercancel'].forEach(ev=>wrap.addEventListener(ev,()=>drawing=false));
   card.querySelector(`[data-clear="${i}"]`).addEventListener('click',()=>{
     ctx.clearRect(0,0,cv.width,cv.height);
     hint.classList.remove('hidden');
     wrap.removeAttribute('data-confirming');
     card.querySelector(`[data-ro]`).textContent='+0';
   });

   /* --- tap ✓ : recognize via Tesseract.js, show confirm overlay --- */
   card.querySelector(`[data-accept="${i}"]`).addEventListener('click',async e=>{
     e.stopPropagation();
     const btn=card.querySelector(`[data-accept]`);
     btn.style.opacity='0.4';
     const value=await recognizeOCR(cv);
     btn.style.opacity='';
     if(value===null){
       wrap.style.animation='none';void wrap.offsetWidth;wrap.style.animation='shake 300ms ease';
       setTimeout(()=>wrap.style.animation='',320);
       return;
     }
     wrap.querySelector(`[data-confirm-num]`).textContent=value;
     wrap.setAttribute('data-confirming','');
   });

   /* --- confirm overlay buttons (delegated on card so they always fire) --- */
   card.addEventListener('click',e=>{
     const retryBtn=e.target.closest('[data-retry]');
     const okBtn=e.target.closest('[data-ok]');
     if(!retryBtn&&!okBtn)return;
     if(retryBtn){
       ctx.clearRect(0,0,cv.width,cv.height);
       hint.classList.remove('hidden');
       wrap.removeAttribute('data-confirming');
     }else if(okBtn){
       const ro=card.querySelector(`[data-ro]`);
       const numText=wrap.querySelector(`[data-confirm-num]`).textContent;
       ro.textContent=numText.startsWith('-')?numText:'+'+numText;
       ro.classList.remove('flash');void ro.offsetWidth;ro.classList.add('flash');
       wrap.removeAttribute('data-confirming');
       setTimeout(()=>next(),300);
     }
   });

  /* --- Tesseract.js OCR on canvas --- */
  async function recognizeOCR(canvas){
    try{
      if(!window._tessWorker){
        window._tessWorker=await Tesseract.createWorker('eng',1,{
          tessedit_char_whitelist:'0123456789',
          tessedit_pageseg_mode:'7' // single line
        });
      }
      // upscale canvas for better OCR
      const tmp=document.createElement('canvas');
      tmp.width=canvas.width*3;tmp.height=canvas.height*3;
      const tc=tmp.getContext('2d');
      tc.fillStyle='#ffffff';tc.fillRect(0,0,tmp.width,tmp.height);
      tc.drawImage(canvas,0,0,tmp.width,tmp.height);
      const{data:{text}}=await window._tessWorker.recognize(tmp);
      const cleaned=text.replace(/[^0-9]/g,'');
      return cleaned.length?parseInt(cleaned,10):null;
    }catch(err){
      console.warn('OCR failed:',err);
      return null;
    }
  }

  /* swipe on card (excluding canvas) */
   let sx=0,sy=0,t=null;
   card.addEventListener('pointerdown',e=>{
     if(wrap.contains(e.target))return;
     sx=e.clientX;sy=e.clientY;
     t=setTimeout(()=>t=null,600);
   });
   card.addEventListener('pointerup',e=>{
     if(wrap.contains(e.target)||!t)return;
     clearTimeout(t);t=null;
     const dx=e.clientX-sx,dy=e.clientY-sy;
     if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){
       if(dx<0&&idx<cards.length-1){idx++;paint();}
       else if(dx>0&&idx>0){idx--;paint();}
     }
   });
 });

 /* --- coach --- */
 const coach=root.querySelector('#coach');
 const steps=[
  {t:'Score the round',b:`Tap <strong>Score Round</strong> and one card per player appears. Draw their points with your finger — no keyboard needed.`},
  {t:'Tap ✓ to check',b:`When you're done drawing, tap the <strong>✓ button</strong>. Your written number appears large — confirm it or try again.`},
  {t:'Swipe to save &amp; advance',b:`Once accepted, <strong>swipe left</strong> to save that score and slide to the next player automatically. Swipe right to go back and fix anything.`},
 ];
 let cs=0;
 function paintCoach(){
   root.querySelector('#cstep').textContent=`Step ${cs+1} of ${steps.length}`;
   root.querySelector('#ctitle').innerHTML=steps[cs].t;
   root.querySelector('#cbody').innerHTML=steps[cs].b;
   root.querySelector('[data-cnext]').textContent=cs===steps.length-1?'Start scoring ✓':'Next tip →';
 }
 root.querySelector('[data-cnext]').addEventListener('click',()=>{
   cs++;if(cs>=steps.length){coach.style.display='none';screen.setAttribute('data-deck','')}else paintCoach();
 });
 root.querySelector('[data-skip]').addEventListener('click',()=>{coach.style.display='none';screen.setAttribute('data-deck','')});
}

/* Picker */
const variants=[{n:'Deck + Coach',f:renderRest},{n:'Deck only',f:()=>renderRest().replace('<div class="coach" id="coach">','<div class="coach" id="coach" style="display:none">')}];
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const hl=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let cur=0;
function moveHl(){const el=items[cur];hl.style.width=el.offsetWidth+'px';hl.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML=variants[i].f();bind(stage)}
function setActive(i){
 cur=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);j===i?el.setAttribute('aria-current','true'):el.removeAttribute('aria-current')});
 moveHl();const u=new URL(location);u.searchParams.set('v',i+1);history.replaceState(null,'',u);mount(i);
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
picker.querySelector('.proto-picker-replay').addEventListener('click',()=>mount(cur));
window.addEventListener('resize',moveHl);
document.addEventListener('keydown',e=>{
 if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 const n=parseInt(e.key,10);if(n>=1&&n<=variants.length)setActive(n-1);
 else if(e.key==='ArrowRight')setActive((cur+1)%variants.length);
 else if(e.key==='ArrowLeft')setActive((cur-1+variants.length)%variants.length);
 else if(e.key==='r'||e.key==='R')mount(cur);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
