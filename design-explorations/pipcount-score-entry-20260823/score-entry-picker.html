<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipCount · score entry prototypes</title>
<style>
:root{
  color-scheme:light;
  --paper:#f0f0e4;--slip:#fcf6f0;--sunken:#e9e5d8;--ink:#171712;--muted:#756f63;--rule:#cfc8ba;
  --blue:#0036a8;--red:#de181e;--yellow:#fcb412;--green:#008a42;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.3 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#d8d5cb;color:var(--ink)}
button,input{font:inherit}
.stage{min-height:100vh;display:grid;place-items:center;padding:96px 20px 40px}
.phone{position:relative;width:min(430px,calc(100vw - 24px));height:min(880px,calc(100vh - 128px));min-height:720px;overflow:hidden;border:9px solid #111;border-radius:48px;background:var(--paper);box-shadow:0 28px 70px rgba(0,0,0,.25)}
.status{height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px 8px;font-size:12px;font-weight:750}
.island{position:absolute;top:12px;left:50%;width:116px;height:30px;transform:translateX(-50%);border-radius:20px;background:#111}
.screen{height:calc(100% - 46px);display:flex;flex-direction:column;overflow:hidden;position:relative}
.screen-scroll{flex:1;overflow:auto;scrollbar-width:none}
.screen-scroll::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 18px 10px}
.eyebrow{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.title{margin:2px 0 0;font-family:"Arial Black","Futura",Inter,sans-serif;font-size:30px;line-height:.96;letter-spacing:-.045em}
.round-mark{border:1px solid var(--ink);padding:7px 9px;font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;transform:rotate(2deg);background:var(--slip)}
.paper{background:var(--slip);border:1.5px solid var(--ink);box-shadow:4px 5px 0 rgba(23,23,18,.09)}
.shape{display:inline-block;flex:none}
.circle{border-radius:50%}.square{}.triangle{width:0!important;height:0!important;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid var(--yellow);background:transparent!important}.diamond{transform:rotate(45deg) scale(.72)}
.blue{background:var(--blue)}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}
.score-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.05em}
.icon-button,.submit,.secondary,.mode-toggle,.canvas-accept,.canvas-clear,.dialog-row,.dialog-return,.dialog-cancel{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.icon-button:active,.submit:active,.mode-toggle:active,.canvas-accept:active,.dialog-return:active{transform:scale(.97)}
.submit{min-height:58px;width:100%;background:var(--blue);color:white;font-weight:820;font-size:16px;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.secondary{min-height:44px;background:var(--slip);color:var(--ink);border:1.5px solid var(--ink);font-weight:720}
.mode-toggle{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 16px;background:var(--sunken);border:1.5px dashed var(--ink);font-weight:750;font-size:13px;color:var(--ink)}
.action-shelf{padding:10px 18px 24px;display:grid;gap:8px;background:color-mix(in srgb,var(--paper) 92%,transparent);border-top:1px solid var(--rule)}
.ledger-list{margin:0 18px 8px}
.ledger-head{padding:8px 12px;border-bottom:1.5px solid var(--ink);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;display:flex;justify-content:space-between}
.ledger-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:104px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.identity{display:flex;align-items:center;gap:10px;min-width:0}
.identity .shape{width:25px;height:25px;border:1px solid var(--ink)}
.identity b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.identity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
/* canvas */
.canvas-wrap{position:relative;width:170px;height:78px;background:white;border:1.5px solid var(--ink);overflow:hidden}
.canvas-wrap canvas{display:block;touch-action:none;cursor:crosshair}
.canvas-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:11px;pointer-events:none;transition:opacity 160ms var(--ease-out)}
.canvas-hint.hidden{opacity:0}
.canvas-side{display:flex;flex-direction:column;gap:5px;margin-left:6px}
.canvas-accept,.canvas-clear{width:38px;height:38px;border:1.5px solid var(--ink);background:var(--slip);display:grid;place-items:center;font-weight:800;font-size:15px}
.canvas-accept{background:var(--green);color:#fff}
.rd-readout{display:inline-grid;place-items:center;min-width:46px;height:34px;border:1px solid var(--ink);background:white;font:850 20px ui-monospace,SFMono-Regular,Menlo,monospace}
.rd-readout.flash{animation:rd-flash 200ms var(--ease-out)}
@keyframes rd-flash{0%{background:var(--yellow)}100%{background:white}}
/* dialog */
.dialog-backdrop{position:absolute;inset:0;background:rgba(23,23,18,.42);opacity:0;animation:backdrop-in 220ms var(--ease-out) forwards}
@keyframes backdrop-in{to{opacity:1}}
.dialog{position:absolute;left:0;right:0;bottom:0;background:var(--slip);border-top:1.5px solid var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.28);padding:14px 18px 26px;transform:translateY(100%);animation:sheet-up 300ms var(--ease-out) forwards;display:flex;flex-direction:column;max-height:82%}
@keyframes sheet-up{to{transform:none}}
.dialog-grab{width:38px;height:4px;border-radius:4px;background:var(--rule);margin:0 auto 10px}
.dialog-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.dialog-head h3{margin:0;font-family:"Arial Black","Futura",sans-serif;font-size:21px;letter-spacing:-.03em}
.dialog-head small{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.11em}
.dialog-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--rule)}
.dialog-row[data-focused]{background:color-mix(in srgb,var(--yellow) 18%,transparent)}
.dialog-row .shape{width:20px;height:20px;border:1px solid var(--ink)}
.dialog-row b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dialog-row small{color:var(--muted);font-size:10px}
.dialog-row input{width:86px;min-height:44px;text-align:right;font:850 24px ui-monospace,SFMono-Regular,Menlo,monospace;border:1.5px solid var(--ink);background:white;padding:0 8px;border-radius:0;outline:none}
.dialog-row input:focus{border-color:var(--blue);box-shadow:2px 2px 0 var(--blue)}
.dialog-row[data-committed] input{border-color:var(--green);color:var(--green)}
.kbd-accessory{display:flex;justify-content:space-between;align-items:center;background:var(--sunken);border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:7px 12px;margin-top:auto}
.kbd-accessory .hint{font-size:11px;color:var(--muted);font-weight:700}
.dialog-return{min-height:42px;padding:0 22px;background:var(--blue);color:#fff;font-weight:820;font-size:14px;border:1.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 4px 2px}
.numpad button{min-height:48px;border:1px solid var(--ink);background:white;font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.numpad button:active{transform:scale(.97);background:var(--sunken)}
.numpad .np-del{background:var(--slip);color:var(--red)}
.numpad .np-blank{visibility:hidden}
@media(prefers-reduced-motion:reduce){
  .dialog-backdrop,.dialog{animation-duration:1ms}
  .canvas-hint{transition:none}
  .rd-readout.flash{animation:none}
}
/* Picker: copied verbatim from Emil Kowalski's prototype skill PICKER.md */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Ink Lines</button>
  <button class="proto-picker-item">Ledger Pad</button>
  <button class="proto-picker-item">Slip Stack</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
window.addEventListener('error',event=>{window.__prototypeError=`${event.message} @ ${event.lineno}:${event.colno}`});
const people=[
  {name:'Mina',total:128,color:'red',shape:'circle'},
  {name:'Omar',total:116,color:'blue',shape:'square'},
  {name:'Jules',total:94,color:'yellow',shape:'triangle'},
  {name:'Kai',total:83,color:'green',shape:'diamond'}
];
const marker=p=>`<span class="shape ${p.shape} ${p.color}"></span>`;
function topbar(){return `<header class="topbar"><div><div class="eyebrow">Scoreboard · highest wins</div><h1 class="title">Round<br>4</h1></div><div class="round-mark">LIVE · 4 PLAYERS</div></header>`}
function shelf(extra=''){return `<div class="action-shelf">${extra}<button class="mode-toggle" data-action="open-dialog">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
Type score</button><button class="submit">Submit Round ✓</button></div>`}

/* ---------- shared canvas behaviour ---------- */
function bindCanvas(root){
  root.querySelectorAll('.ledger-row').forEach((row,idx)=>{
    const cv=row.querySelector('canvas');if(!cv)return;
    const ctx=cv.getContext('2d');ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#171712';
    const hint=row.querySelector('.canvas-hint'),readout=row.querySelector('.rd-readout');
    let drawing=false,strokes=0,t=null;
    const pos=e=>{const r=cv.getBoundingClientRect();const t0=e.touches?e.touches[0]:e;return[t0.clientX-r.left,t0.clientY-r.top]};
    const start=e=>{drawing=true;strokes++;hint.classList.add('hidden');cv.setPointerCapture?.(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};
    const move=e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};
    const end=()=>{drawing=false;clearTimeout(t);t=setTimeout(()=>recognize(row),1200)};
    cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);
    cv.addEventListener('pointerup',end);cv.addEventListener('pointerleave',end);
    row.querySelector('.canvas-clear').addEventListener('click',()=>{ctx.clearRect(0,0,cv.width,cv.height);strokes=0;hint.classList.remove('hidden')});
    row.querySelector('.canvas-accept').addEventListener('click',()=>recognize(row,true));
    function recognize(r,manual){
      // fake recognizer: count strokes as a stand-in for digits in the demo
      if(strokes===0){if(manual){readout.classList.remove('flash');void readout.offsetWidth;}return}
      const v=Math.min(99,Math.max(1,strokes*3));
      readout.textContent=(v>0?'+':'')+v;
      readout.classList.remove('flash');void readout.offsetWidth;readout.classList.add('flash');
    }
  });
}

/* ---------- variant 1 : Ink Lines — canvas replaces the rail, inline ---------- */
function renderInkLines(){
  const rows=people.map(p=>`
   <div class="ledger-row">
     <div class="identity">${marker(p)}<div><b>${p.name}</b><small>Total ${p.total}</small></div></div>
     <div style="display:flex;align-items:center">
       <div class="canvas-wrap"><canvas width="166" height="74"></canvas><div class="canvas-hint">✎ write score</div></div>
       <div class="canvas-side">
         <span class="rd-readout score-num">+0</span>
         <button class="canvas-accept" title="Accept">✓</button>
         <button class="canvas-clear" title="Clear">⌫</button>
       </div>
     </div>
   </div>`).join('');
  return `<div class="screen ink-screen">${topbar()}<div class="screen-scroll"><section class="paper ledger-list"><div class="ledger-head"><span>Player · total</span><span>Write round pts</span></div>${rows}</section></div>${shelf()}</div>`;
}

/* ---------- variant 2 : Ledger Pad — big single-player canvas carousel ---------- */
function renderLedgerPad(){
  const cards=people.map((p,i)=>`
   <div class="pad-card" data-idx="${i}" ${i===0?'data-active':''}>
     <div class="pad-head">${marker(p)}<b>${p.name}</b><small>Total ${p.total}</small><span class="rd-readout score-num pad-readout">+0</span></div>
     <div class="pad-canvas-wrap"><canvas width="352" height="210"></canvas><div class="canvas-hint" style="font-size:14px">✎ write ${p.name}'s points large</div></div>
     <div class="pad-actions"><button class="canvas-clear">Clear</button><button class="canvas-accept">Accept ✓ &amp; next →</button></div>
   </div>`).join('');
  return `<style>
   .pad-card{display:none;margin:4px 18px 8px;padding:14px}
   .pad-card[data-active]{display:block;animation:card-in 220ms var(--ease-out)}
   @keyframes card-in{0%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}
   .pad-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
   .pad-head b{font-size:18px}.pad-head small{color:var(--muted);font-size:11px;margin-right:auto}
   .pad-canvas-wrap{position:relative;background:white;border:1.5px solid var(--ink);height:212px}
   .pad-canvas-wrap canvas{display:block;touch-action:none;cursor:crosshair}
   .pad-actions{display:grid;grid-template-columns:.55fr 1fr;gap:8px;margin-top:9px}
   .pad-dots{display:flex;gap:6px;justify-content:center;padding:2px 0 10px}
   .pad-dot{width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:transparent}
   .pad-dot[data-on]{background:var(--blue)}
   @media(prefers-reduced-motion:reduce){.pad-card[data-active]{animation:none}}
  </style>
  <div class="screen pad-screen">${topbar()}
   <div class="screen-scroll">
     <div class="pad-dots">${people.map((_,i)=>`<span class="pad-dot" data-dot="${i}" ${i===0?'data-on':''}></span>`).join('')}</div>
     ${cards}
   </div>${shelf()}</div>`;
}

/* ---------- variant 3 : Slip Stack — dialog-first typed entry over live table ---------- */
function renderSlipStack(){
  const rows=people.map(p=>`
   <div class="ledger-row" style="min-height:64px">
     <div class="identity">${marker(p)}<div><b>${p.name}</b><small>Total ${p.total}</small></div></div>
     <span class="rd-readout score-num slip-readout">+0</span>
   </div>`).join('');
  const dlgRows=people.map((p,i)=>`
   <label class="dialog-row" data-idx="${i}">
     <span style="display:flex;align-items:center;gap:9px;min-width:0">${marker(p)}<span style="min-width:0"><b>${p.name}</b><small>TOTAL ${p.total}</small></span></span>
     <input class="score-num" data-field="${i}" inputmode="numeric" value="${i===0?'':''}" placeholder="—" ${i===0?'autofocus':''}>
     <span class="commit-tick" style="width:20px;color:var(--green);font-weight:900"></span>
   </label>`).join('');
  return `<style>
   .slip-screen .dialog-backdrop,.slip-screen .dialog{display:none}
   .slip-screen[data-dialog] .dialog-backdrop{display:block}
   .slip-screen[data-dialog] .dialog{display:flex}
  </style>
  <div class="screen slip-screen" data-dialog>
    ${topbar()}
    <div class="screen-scroll"><section class="paper ledger-list"><div class="ledger-head"><span>Player · total</span><span>Round pts</span></div>${rows}</section></div>
    ${shelf(`<button class="mode-toggle" data-action="close-dialog" style="border-style:solid;background:var(--paper)">← Back to writing</button>`)}
    <div class="dialog-backdrop" data-action="close-dialog"></div>
    <div class="dialog" role="dialog" aria-label="Type round scores">
      <div class="dialog-grab"></div>
      <div class="dialog-head"><h3>Type the scores</h3><small>Return = next player</small></div>
      <div class="screen-scroll">${dlgRows}</div>
      <div class="kbd-accessory"><span class="hint" data-hint>Mina · Return to continue</span><button class="dialog-return" data-return>Return ⏎</button></div>
      <div class="numpad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button class="np-blank"></button><button data-k="0">0</button><button class="np-del" data-k="del">⌫</button>
      </div>
    </div>
  </div>`;
}

function bindSlipStack(root){
  const screen=root.querySelector('.slip-screen');
  const fields=[...root.querySelectorAll('[data-field]')];
  const rows=[...root.querySelectorAll('.dialog-row')];
  const readouts=[...root.querySelectorAll('.slip-readout')];
  const hint=root.querySelector('[data-hint]');
  const retBtn=root.querySelector('[data-return]');
  let idx=0;
  function paint(){
    fields.forEach((f,i)=>{rows[i].toggleAttribute('data-focused',i===idx)});
    if(hint&&fields[idx]){hint.textContent=`${people[idx].name} · Return to ${idx===fields.length-1?'finish':'continue'}`}
    retBtn.textContent=idx===fields.length-1?'Done ✓':'Return ⏎';
  }
  function commit(){
    const f=fields[idx];const v=parseInt(f.value||'',10);
    if(!isNaN(v)){readouts[idx].textContent=(v>=0?'+':'')+v;
      rows[idx].setAttribute('data-committed','');
      rows[idx].querySelector('.commit-tick').textContent='✓';}
    if(idx<fields.length-1){idx++;paint();fields[idx].focus();fields[idx].select();}
    else{/* last: stay, show done state */retBtn.textContent='Done ✓';}
  }
  fields.forEach((f,i)=>{
    f.addEventListener('focus',()=>{idx=i;paint()});
    f.addEventListener('input',()=>{f.value=f.value.replace(/[^0-9\-]/g,'').slice(0,5);rows[i].removeAttribute('data-committed');rows[i].querySelector('.commit-tick').textContent=''});
    f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Go'){e.preventDefault();commit()}});
  });
  retBtn.addEventListener('click',commit);
  root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.action==='close-dialog')screen.removeAttribute('data-dialog');
    else screen.setAttribute('data-dialog','');
  }));
  root.querySelectorAll('[data-k]').forEach(k=>k.addEventListener('click',()=>{
    const f=fields[idx];if(!f)return;
    if(k.dataset.k==='del'){f.value=f.value.slice(0,-1)}
    else if(f.value.length<5){f.value+=k.dataset.k}
    rows[idx].removeAttribute('data-committed');rows[idx].querySelector('.commit-tick').textContent='';
    f.dispatchEvent(new Event('input'));
  }));
  paint();setTimeout(()=>fields[0]?.focus(),350);
}

function bindPad(root){
  const cards=[...root.querySelectorAll('.pad-card')];
  const dots=[...root.querySelectorAll('.pad-dot')];
  let i=0;
  root.querySelectorAll('.canvas-accept').forEach(btn=>btn.addEventListener('click',()=>{
    const card=btn.closest('.pad-card');const ro=card.querySelector('.pad-readout');
    ro.textContent='+9';ro.classList.add('flash');setTimeout(()=>ro.classList.remove('flash'),240);
    setTimeout(()=>{cards[i].removeAttribute('data-active');dots[i].removeAttribute('data-on');
      i=(i+1)%cards.length;cards[i].setAttribute('data-active','');dots[i].setAttribute('data-on','');
    },320);
  }));
  cards.forEach(card=>{
    const cv=card.querySelector('canvas');if(!cv)return;
    const ctx=cv.getContext('2d');ctx.lineWidth=9;ctx.lineCap='round';
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    let drawing=false;
    cv.addEventListener('pointerdown',e=>{drawing=true;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});
    cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});
    cv.addEventListener('pointerup',()=>drawing=false);
    card.querySelector('.canvas-clear').addEventListener('click',()=>ctx.clearRect(0,0,cv.width,cv.height));
  });
}

const variants=[
  {render:renderInkLines,bind:bindCanvas},
  {render:renderLedgerPad,bind:bindPad},
  {render:renderSlipStack,bind:(r)=>{bindCanvas(r);bindSlipStack(r)}},
];

const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;

function moveHighlight(){
  const el=items[current];
  highlight.style.width=el.offsetWidth+'px';
  highlight.style.transform=`translateX(${el.offsetLeft}px)`;
}
function mount(i){
  stage.innerHTML='';
  requestAnimationFrame(()=>{
    stage.innerHTML=variants[i].render();
    variants[i].bind(stage);
  });
}
function setActive(i){
  if(i<0||i>=variants.length)return;
  current=i;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();
  const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);
  mount(i);
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',(e)=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const num=parseInt(e.key,10);
  if(num>=1&&num<=variants.length)setActive(num-1);
  else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R')mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
