<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PipCount · scoring motion prototypes</title>
<style>
:root{
  color-scheme:light;
  --paper:#f0f0e4;--slip:#fcf6f0;--sunken:#e9e5d8;--ink:#171712;--muted:#756f63;--rule:#cfc8ba;
  --blue:#0036a8;--blue-press:#002a78;--red:#de181e;--yellow:#fcb412;--green:#008a42;--sky:#ccdeea;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-move:cubic-bezier(.77,0,.175,1);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.3 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#d8d5cb;color:var(--ink)}
button,input{font:inherit}.stage{min-height:100vh;display:grid;place-items:center;padding:86px 20px 34px}.phone{position:relative;width:min(430px,calc(100vw - 24px));height:min(880px,calc(100vh - 116px));min-height:700px;overflow:hidden;border:9px solid #111;border-radius:48px;background:var(--paper);box-shadow:0 28px 70px rgba(0,0,0,.25)}
.status{height:46px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px 8px;font-size:12px;font-weight:750}.island{position:absolute;top:12px;left:50%;width:116px;height:30px;transform:translateX(-50%);border-radius:20px;background:#111}.screen{height:calc(100% - 46px);display:flex;flex-direction:column;overflow:hidden}.screen-scroll{flex:1;overflow:auto;scrollbar-width:none}.screen-scroll::-webkit-scrollbar{display:none}.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 18px 10px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}.title{margin:2px 0 0;font-family:"Arial Black","Futura",Inter,sans-serif;font-size:30px;line-height:.96;letter-spacing:-.045em}.round-mark{border:1px solid var(--ink);padding:7px 9px;font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace;transform:rotate(2deg);background:var(--slip)}
.paper{background:var(--slip);border:1.5px solid var(--ink);box-shadow:4px 5px 0 rgba(23,23,18,.09)}.shape{display:inline-block;flex:none}.circle{border-radius:50%}.square{}.triangle{width:0!important;height:0!important;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:15px solid var(--yellow);background:transparent!important}.diamond{transform:rotate(45deg) scale(.72)}.blue{background:var(--blue)}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}
.icon-button,.step,.quick,.player-tab,.submit,.secondary{border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.icon-button:active,.step:active,.quick:active,.player-tab:active,.submit:active,.secondary:active{transform:scale(.97)}.step,.quick,.submit,.secondary,.player-tab{transition:transform 100ms var(--ease-out),background-color 140ms ease,color 140ms ease}.step{width:54px;height:54px;border:1.5px solid var(--ink);background:var(--slip);font-size:28px;font-weight:700}.step.plus{background:var(--blue);color:white}.step.minus{color:var(--red)}.quick{min-width:44px;height:34px;border:1px solid var(--rule);background:var(--paper);font:750 13px ui-monospace,SFMono-Regular,Menlo,monospace}.submit{min-height:58px;background:var(--blue);color:white;font-weight:820;font-size:16px;letter-spacing:.01em;border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}.secondary{min-height:50px;background:var(--slip);color:var(--ink);border:1.5px solid var(--ink);font-weight:720}.score-num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.05em}.delta{display:inline-grid;place-items:center;min-width:52px;height:42px;font:850 26px ui-monospace,SFMono-Regular,Menlo,monospace}.delta.changed{animation:delta-pop 180ms var(--ease-out)}@keyframes delta-pop{0%{transform:scale(.96);opacity:.55}100%{transform:scale(1);opacity:1}}.submit.success{background:var(--green);animation:stamp 240ms var(--ease-out)}@keyframes stamp{0%{transform:scale(.96);opacity:.6}100%{transform:scale(1);opacity:1}}
.geometry{position:relative;overflow:hidden}.geometry::before,.geometry::after{content:"";position:absolute}.announce{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* Ledger Rail */
.ledger-screen{background:var(--paper)}.ledger-scoreline{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin:0 18px 12px;padding:12px 14px;border-top:4px solid var(--blue);border-bottom:1px solid var(--ink)}.ledger-scoreline strong{font:900 44px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.ledger-scoreline .mini-bars{width:100px;height:56px}.mini-bars span{position:absolute;bottom:0;width:18px;border:1px solid var(--ink)}.mini-bars span:nth-child(1){left:7px;height:24px;background:var(--red)}.mini-bars span:nth-child(2){left:30px;height:42px;background:var(--yellow)}.mini-bars span:nth-child(3){left:53px;height:52px;background:var(--blue)}.mini-bars span:nth-child(4){left:76px;height:34px;background:var(--green)}.ledger-list{margin:0 18px 12px}.ledger-head,.ledger-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}.ledger-head{padding:8px 12px;border-bottom:1.5px solid var(--ink);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.13em}.ledger-row{min-height:98px;padding:9px 12px;border-bottom:1px solid var(--rule)}.identity{display:flex;align-items:center;gap:10px;min-width:0}.identity .shape{width:25px;height:25px;border:1px solid var(--ink)}.identity b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.rail-controls{display:grid;grid-template-columns:54px 54px 54px;align-items:center;gap:5px}.rail-controls .delta{text-align:center}.quickrail{grid-column:1/-1;display:flex;justify-content:flex-end;gap:5px;margin-top:5px}.action-shelf{display:grid;grid-template-columns:.42fr 1fr;gap:9px;padding:12px 18px 22px;background:color-mix(in srgb,var(--paper) 92%,transparent);border-top:1px solid var(--rule)}
/* Token Stage */
.focus-screen{background:var(--paper)}.standings-ribbon{display:flex;gap:5px;overflow:auto;padding:2px 18px 12px}.player-tab{display:grid;grid-template-columns:auto auto;gap:5px;align-items:center;min-width:86px;padding:8px;background:var(--slip);border:1px solid var(--rule);color:var(--ink)}.player-tab[data-selected]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.player-tab .shape{width:14px;height:14px;border:1px solid currentColor}.player-tab strong{font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace}.focus-card{position:relative;margin:4px 18px 14px;padding:18px;min-height:390px;display:flex;flex-direction:column}.focus-card::before{content:"";position:absolute;right:-1px;top:-1px;width:112px;height:112px;background:conic-gradient(var(--blue) 0 25%,var(--yellow) 0 50%,transparent 0 75%,var(--red) 0);border-left:1px solid var(--ink);border-bottom:1px solid var(--ink);opacity:.95}.focus-name{display:flex;align-items:center;gap:10px;position:relative;z-index:1}.focus-name .shape{width:42px;height:42px;border:1.5px solid var(--ink)}.focus-name h2{font:900 34px/1 "Arial Black","Futura",sans-serif;margin:0}.focus-total{margin-top:52px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}.focus-total strong{display:block;color:var(--ink);font:900 64px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.focus-step{margin:auto 0 6px;display:grid;grid-template-columns:74px 1fr 74px;align-items:center;gap:12px}.focus-step .step{width:74px;height:74px;font-size:36px}.focus-step .delta{font-size:52px;height:auto}.focus-quicks{display:flex;justify-content:center;gap:7px}.focus-actions{display:grid;grid-template-columns:1fr .52fr;gap:9px;padding:0 18px 22px}.focus-actions .submit{order:-1}.focus-card.swap{animation:focus-swap 180ms var(--ease-out)}@keyframes focus-swap{0%{opacity:.25;transform:translateX(10px)}100%{opacity:1;transform:translateX(0)}}
/* Score Wall */
.wall-screen{background:var(--ink);color:var(--paper)}.wall-screen .topbar{color:var(--paper)}.wall-screen .eyebrow{color:var(--yellow)}.wall-screen .round-mark{background:var(--paper);color:var(--ink)}.wall-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:4px 12px 12px;min-height:530px}.wall-card{position:relative;display:flex;flex-direction:column;padding:13px;background:var(--slip);color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--paper)}.wall-card[data-color="red"]{border-top:12px solid var(--red)}.wall-card[data-color="blue"]{border-top:12px solid var(--blue)}.wall-card[data-color="yellow"]{border-top:12px solid var(--yellow)}.wall-card[data-color="green"]{border-top:12px solid var(--green)}.wall-card .identity .shape{width:22px;height:22px}.wall-card .identity b{font-size:14px}.wall-score{margin:auto 0 6px;text-align:center;font:900 54px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.wall-round{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:9px}.wall-round .step{width:46px;height:46px}.wall-round .delta{min-width:43px;font-size:24px}.wall-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.wall-quick .quick{min-width:0}.wall-actions{display:grid;grid-template-columns:1fr .45fr;gap:7px;padding:0 12px 22px}.wall-actions .submit{order:-1;background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 var(--paper)}
.enter .topbar{animation:enter-top 240ms var(--ease-out)}.enter .paper,.enter .wall-card{animation:enter-card 240ms var(--ease-out) both}.enter .paper:nth-of-type(2),.enter .wall-card:nth-child(2){animation-delay:45ms}.enter .wall-card:nth-child(3){animation-delay:90ms}.enter .wall-card:nth-child(4){animation-delay:135ms}@keyframes enter-top{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}@keyframes enter-card{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:none}}
@media(max-height:760px){.phone{min-height:620px}.focus-card{min-height:310px}.wall-grid{min-height:430px}.ledger-row{min-height:82px}.quickrail{display:none}}
@media(prefers-reduced-motion:reduce){.enter .topbar,.enter .paper,.enter .wall-card,.delta.changed,.submit.success,.focus-card.swap{animation:fade 160ms ease-out}.icon-button,.step,.quick,.player-tab,.submit,.secondary{transition:opacity 100ms ease-out}.icon-button:active,.step:active,.quick:active,.player-tab:active,.submit:active,.secondary:active{transform:none;opacity:.74}@keyframes fade{0%{opacity:.4}100%{opacity:1}}}
/* Picker: copied verbatim from Emil Kowalski's prototype skill. */
.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
.proto-picker-highlight {position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight {transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item {position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,.12)}.proto-picker-replay{padding:0 10px;font-size:14px}.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage" class="stage"></div>
<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Ledger Rail</button>
  <button class="proto-picker-item">Token Stage</button>
  <button class="proto-picker-item">Score Wall</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script>
window.addEventListener('error',event=>{window.__prototypeError=`${event.message} @ ${event.lineno}:${event.colno}`});
const people=[
  {name:'Mina',total:128,round:7,color:'red',shape:'circle'},
  {name:'Omar',total:116,round:0,color:'blue',shape:'square'},
  {name:'Jules',total:94,round:0,color:'yellow',shape:'triangle'},
  {name:'Kai',total:83,round:0,color:'green',shape:'diamond'}
];
const variants=[renderLedger,renderFocus,renderWall];
function shell(content,kind){return `<div class="phone"><div class="island"></div><div class="status"><span>9:41</span><span>●●● ᯤ ▰</span></div><div class="screen ${kind}-screen enter">${content}<div class="announce" aria-live="polite"></div></div></div>`}
function marker(p,size=''){return `<span class="shape ${p.shape} ${p.color}" ${size?`style="width:${size}px;height:${size}px"`:''}></span>`}
function controls(p,scope,compact=false){return `<div class="${compact?'wall-round':'rail-controls'}" data-person="${p.name}"><button class="step minus" data-delta="-1" aria-label="Subtract one from ${p.name}">−</button><span class="delta score-num" data-round>${p.round>=0?'+':''}${p.round}</span><button class="step plus" data-delta="1" aria-label="Add one to ${p.name}">+</button>${compact?'':`<div class="quickrail">${[1,5,10].map(n=>`<button class="quick" data-delta="${n}">+${n}</button>`).join('')}</div>`}</div>`}
function topbar(title,subtitle){return `<header class="topbar"><div><div class="eyebrow">${subtitle}</div><h1 class="title">${title}</h1></div><div class="round-mark">ROUND 4 · LIVE</div></header>`}
function renderLedger(){return shell(`${topbar('Score<br>Ledger','Scoreboard · highest wins')}<div class="ledger-scoreline"><div><div class="eyebrow">Leader total</div><strong class="score-num" data-leader>128</strong></div><div class="geometry mini-bars"><span></span><span></span><span></span><span></span></div></div><div class="screen-scroll"><section class="paper ledger-list"><div class="ledger-head"><span>Player · total</span><span>Round points</span></div>${people.map(p=>`<div class="ledger-row"><div class="identity">${marker(p)}<div><b>${p.name}</b><small>Total <span class="score-num" data-total="${p.name}">${p.total}</span>${p.name==='Mina'?' · leading':''}</small></div></div>${controls(p,'ledger')}</div>`).join('')}</section></div><footer class="action-shelf"><button class="secondary" data-undo>Undo</button><button class="submit" data-submit>Submit Round →</button></footer>`,'ledger')}
function renderFocus(){const p=people[0];return shell(`${topbar('Player<br>Focus','One score at a time')}<div class="standings-ribbon">${people.map((x,i)=>`<button class="player-tab" data-player="${x.name}" ${i===0?'data-selected':''}>${marker(x)}<span>${x.name}<br><strong data-tab-total="${x.name}">${x.total}</strong></span></button>`).join('')}</div><div class="screen-scroll"><section class="paper focus-card" data-focus><div class="focus-name">${marker(p,42)}<h2 data-focus-name>${p.name}</h2></div><div class="focus-total">Current total<strong class="score-num" data-focus-total>${p.total}</strong></div><div class="focus-step" data-person="${p.name}"><button class="step minus" data-delta="-1">−</button><span class="delta score-num" data-round>+${p.round}</span><button class="step plus" data-delta="1">+</button></div><div class="focus-quicks">${[1,5,10].map(n=>`<button class="quick" data-delta="${n}">+${n}</button>`).join('')}</div></section></div><footer class="focus-actions"><button class="submit" data-submit>Save Round →</button><button class="secondary" data-next>Next</button></footer>`,'focus')}
function renderWall(){return shell(`${topbar('Score<br>Wall','All players · one glance')}<div class="screen-scroll"><section class="wall-grid">${people.map(p=>`<article class="wall-card" data-color="${p.color}"><div class="identity">${marker(p)}<b>${p.name}</b></div><div class="wall-score score-num" data-total="${p.name}">${p.total}</div>${controls(p,'wall',true)}<div class="wall-quick">${[1,5,10].map(n=>`<button class="quick" data-delta="${n}" data-person="${p.name}">+${n}</button>`).join('')}</div></article>`).join('')}</section></div><footer class="wall-actions"><button class="submit" data-submit>Stamp Round ✓</button><button class="secondary" data-undo>Undo</button></footer>`,'wall')}
function currentPerson(el){const container=el.closest('[data-person]');return container?.dataset.person||el.dataset.person||document.querySelector('[data-focus] [data-person]')?.dataset.person}
function stateFor(name){return people.find(p=>p.name===name)}
function updateRound(name,delta){const p=stateFor(name);if(!p)return;p.round=Math.max(-999,Math.min(999,p.round+delta));document.querySelectorAll(`[data-person="${CSS.escape(name)}"] [data-round]`).forEach(el=>{el.textContent=(p.round>=0?'+':'')+p.round;el.classList.remove('changed');void el.offsetWidth;el.classList.add('changed')});const live=document.querySelector('.announce');if(live)live.textContent=`${name} round score ${p.round}`}
function bindPrototype(){document.querySelectorAll('[data-delta]').forEach(btn=>btn.addEventListener('click',()=>updateRound(currentPerson(btn),Number(btn.dataset.delta))));document.querySelectorAll('[data-player]').forEach(btn=>btn.addEventListener('click',()=>selectFocus(btn.dataset.player)));document.querySelector('[data-next]')?.addEventListener('click',()=>{const current=document.querySelector('[data-player][data-selected]');const tabs=[...document.querySelectorAll('[data-player]')];selectFocus(tabs[(tabs.indexOf(current)+1)%tabs.length].dataset.player)});document.querySelector('[data-submit]')?.addEventListener('click',submitRound);document.querySelector('[data-undo]')?.addEventListener('click',()=>{people.forEach(p=>p.round=0);mount(current)})}
function selectFocus(name){const p=stateFor(name);document.querySelectorAll('[data-player]').forEach(x=>x.toggleAttribute('data-selected',x.dataset.player===name));const card=document.querySelector('[data-focus]');if(!card)return;card.querySelector('[data-focus-name]').textContent=p.name;card.querySelector('[data-focus-total]').textContent=p.total;const markerEl=card.querySelector('.shape');markerEl.className=`shape ${p.shape} ${p.color}`;const controlsEl=card.querySelector('[data-person]');controlsEl.dataset.person=p.name;controlsEl.querySelector('[data-round]').textContent=(p.round>=0?'+':'')+p.round;card.classList.remove('swap');void card.offsetWidth;card.classList.add('swap')}
function submitRound(){people.forEach(p=>{p.total+=p.round;p.round=0});document.querySelectorAll('[data-total]').forEach(el=>el.textContent=stateFor(el.dataset.total).total);document.querySelectorAll('[data-tab-total]').forEach(el=>el.textContent=stateFor(el.dataset.tabTotal).total);document.querySelectorAll('[data-round]').forEach(el=>el.textContent='+0');const leader=Math.max(...people.map(p=>p.total));document.querySelector('[data-leader]')?.replaceChildren(String(leader));document.querySelector('[data-focus-total]')?.replaceChildren(String(stateFor(document.querySelector('[data-player][data-selected]')?.dataset.player||'Mina').total));const btn=document.querySelector('[data-submit]');btn.textContent='Round saved ✓';btn.classList.add('success');setTimeout(()=>{if(btn.isConnected){btn.textContent=current===2?'Stamp Round ✓':current===1?'Save Round →':'Submit Round →';btn.classList.remove('success')}},850);document.querySelector('.announce').textContent='Round saved'}
// `variants` is an array of render functions, one per variant, in picker order.
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();bindPrototype()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));replay?.addEventListener('click',()=>mount(current));window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.metaKey||e.ctrlKey||e.altKey)return;const num=parseInt(e.key,10);if(num>=1&&num<=variants.length)setActive(num-1);else if(e.key==='ArrowRight')setActive((current+1)%variants.length);else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);else if(e.key==='r'||e.key==='R')mount(current)});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
