<svg xmlns="http://www.w3.org/2000/svg" id="cup-mascot-light" viewBox="0 0 96 80" width="384" height="320">
  <!--
    Cup — ScoreKeeper mascot (light / beige-console skin: slate ink with red stripe).
    Identical geometry and group names to cup-mascot-dark.svg, so one Rive rig
    drives both — import either file, then swap fills per theme.

    #cup-root      whole character — jump, squash-and-stretch (origin 48,72 bottom-center)
    #handle-left / #handle-right  wiggle (origins 16,20 / 80,20)
    #eye-left / #eye-right        blink = scaleY to 0.1
    #mouth         expressions; #shine gleam sweep; #stripe is the light-skin accent
    #sparkles > #spark-1..4       win particles

    Palette (light skin): body #33383D · shine #4A5058 · cutouts #E6E1D3 · stripe #A93226 · sparks #A93226 / #2F5E93
  -->
  <g id="sparkles">
    <rect id="spark-1" x="8" y="0" width="6" height="6" fill="#A93226"/>
    <rect id="spark-2" x="84" y="6" width="6" height="6" fill="#2F5E93"/>
    <rect id="spark-3" x="0" y="44" width="6" height="6" fill="#2F5E93"/>
    <rect id="spark-4" x="90" y="50" width="6" height="6" fill="#A93226"/>
  </g>
  <g id="cup-root">
    <g id="handles">
      <g id="handle-left">
        <rect x="0" y="16" width="16" height="8" fill="#33383D"/>
        <rect x="0" y="24" width="8" height="8" fill="#33383D"/>
      </g>
      <g id="handle-right">
        <rect x="80" y="16" width="16" height="8" fill="#33383D"/>
        <rect x="88" y="24" width="8" height="8" fill="#33383D"/>
      </g>
    </g>
    <g id="bowl">
      <rect id="bowl-rim" x="16" y="8" width="64" height="8" fill="#33383D"/>
      <rect id="stripe" x="40" y="8" width="16" height="8" fill="#A93226"/>
      <rect id="bowl-body" x="16" y="16" width="64" height="32" fill="#33383D"/>
      <rect id="shine" x="22" y="20" width="8" height="12" fill="#4A5058"/>
      <g id="face">
        <rect id="eye-left" x="30" y="24" width="8" height="8" fill="#E6E1D3"/>
        <rect id="eye-right" x="58" y="24" width="8" height="8" fill="#E6E1D3"/>
        <rect id="mouth" x="38" y="38" width="20" height="6" fill="#E6E1D3"/>
      </g>
    </g>
    <g id="stem">
      <rect x="40" y="48" width="16" height="8" fill="#33383D"/>
    </g>
    <g id="base">
      <rect id="base-top" x="32" y="56" width="32" height="8" fill="#33383D"/>
      <rect id="base-bottom" x="24" y="64" width="48" height="8" fill="#33383D"/>
    </g>
  </g>
</svg>
