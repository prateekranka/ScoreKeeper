<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScoreKeeper Cup Hybrid A — clean dimensional vector master.
  512 x 416, orthogonal pixel silhouette, no masks/filters/curves.
  The silhouette is intentionally assembled from integer-aligned pieces so the
  two handle gaps remain true transparent holes at render time.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="512" height="416" viewBox="0 0 512 416">
  <defs>
    <!-- Shared canvas-space gradients keep segmented pixel shapes visually continuous. -->
    <linearGradient id="goldBody" gradientUnits="userSpaceOnUse" x1="0" y1="49" x2="0" y2="244">
      <stop offset="0" stop-color="#F8D65A"/>
      <stop offset="0.48" stop-color="#EFB842"/>
      <stop offset="1" stop-color="#D19128"/>
    </linearGradient>
    <linearGradient id="goldLight" gradientUnits="userSpaceOnUse" x1="0" y1="264" x2="0" y2="403">
      <stop offset="0" stop-color="#FFE477"/>
      <stop offset="1" stop-color="#E2A832"/>
    </linearGradient>
    <linearGradient id="goldShadow" gradientUnits="userSpaceOnUse" x1="0" y1="264" x2="0" y2="403">
      <stop offset="0" stop-color="#BC8120"/>
      <stop offset="1" stop-color="#805511"/>
    </linearGradient>
    <linearGradient id="edgeDark" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="403">
      <stop offset="0" stop-color="#94691E"/>
      <stop offset="1" stop-color="#60400D"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="223">
      <stop offset="0" stop-color="#171612"/>
      <stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="31" x2="0" y2="91">
      <stop offset="0" stop-color="#B83E2E"/>
      <stop offset="1" stop-color="#8F251B"/>
    </linearGradient>
  </defs>

  <!-- top-right tab and broad top rail -->
  <rect x="442" y="14" width="42" height="58" fill="url(#edgeDark)"/>
  <rect x="451" y="31" width="17" height="41" fill="url(#goldBody)"/>
  <rect x="70" y="30" width="414" height="43" fill="url(#edgeDark)"/>
  <rect x="88" y="49" width="336" height="23" fill="url(#goldBody)"/>

  <!-- left handle frame: four non-overlapping strips around a true gap -->
  <rect x="9" y="73" width="84" height="56" fill="url(#edgeDark)"/>
  <rect x="9" y="169" width="84" height="55" fill="url(#edgeDark)"/>
  <rect x="9" y="129" width="40" height="40" fill="url(#edgeDark)"/>
  <rect x="72" y="129" width="21" height="40" fill="url(#edgeDark)"/>
  <rect x="29" y="92" width="63" height="20" fill="url(#goldBody)"/>
  <rect x="29" y="169" width="63" height="37" fill="url(#goldBody)"/>
  <rect x="29" y="112" width="20" height="57" fill="url(#goldBody)"/>
  <rect x="72" y="112" width="20" height="57" fill="url(#goldBody)"/>

  <!-- right handle frame: four non-overlapping strips around a true gap -->
  <rect x="420" y="73" width="83" height="56" fill="url(#edgeDark)"/>
  <rect x="420" y="169" width="83" height="55" fill="url(#edgeDark)"/>
  <rect x="420" y="129" width="21" height="40" fill="url(#edgeDark)"/>
  <rect x="465" y="129" width="38" height="40" fill="url(#edgeDark)"/>
  <rect x="421" y="92" width="61" height="20" fill="url(#goldBody)"/>
  <rect x="421" y="169" width="61" height="37" fill="url(#goldBody)"/>
  <rect x="421" y="112" width="20" height="57" fill="url(#goldBody)"/>
  <rect x="465" y="112" width="20" height="57" fill="url(#goldBody)"/>

  <!-- stepped cup body, split around the two transparent handle holes -->
  <rect x="69" y="72" width="372" height="56" fill="url(#edgeDark)"/>
  <rect x="72" y="128" width="369" height="42" fill="url(#edgeDark)"/>
  <rect x="69" y="170" width="372" height="74" fill="url(#edgeDark)"/>
  <rect x="88" y="92" width="335" height="36" fill="url(#goldBody)"/>
  <rect x="91" y="128" width="329" height="42" fill="url(#goldBody)"/>
  <rect x="88" y="170" width="335" height="54" fill="url(#goldBody)"/>
  <!-- red accent: authoritative stepped polygon, deliberately above cup fills -->
  <path d="M215 31 H354 V49 H326 V72 H286 V91 H236 V72 H215 Z" fill="url(#accent)"/>
  <!-- small asymmetric white badge retained from the cleaned Hybrid A -->
  <rect x="109" y="71" width="19" height="20" fill="#F4F2EC"/>
  <rect x="113" y="75" width="13" height="12" fill="#F8D655"/>

  <!-- lower cup steps -->
  <rect x="69" y="224" width="372" height="20" fill="url(#edgeDark)"/>
  <rect x="88" y="225" width="332" height="19" fill="url(#goldBody)"/>
  <rect x="88" y="244" width="334" height="20" fill="url(#edgeDark)"/>
  <rect x="109" y="244" width="290" height="19" fill="url(#goldShadow)"/>

  <!-- square eyes -->
  <rect x="177" y="128" width="38" height="38" fill="url(#ink)"/>
  <rect x="293" y="128" width="38" height="38" fill="url(#ink)"/>

  <!-- straight stepped friendly smile -->
  <rect x="180" y="187" width="19" height="18" fill="url(#ink)"/>
  <rect x="199" y="205" width="111" height="18" fill="url(#ink)"/>
  <rect x="311" y="188" width="18" height="17" fill="url(#ink)"/>

  <!-- stem, pedestal, and two stepped base tiers -->
  <rect x="215" y="264" width="79" height="20" fill="url(#edgeDark)"/>
  <rect x="235" y="265" width="39" height="19" fill="url(#goldLight)"/>
  <rect x="196" y="284" width="117" height="20" fill="url(#edgeDark)"/>
  <rect x="215" y="284" width="77" height="19" fill="url(#goldLight)"/>
  <rect x="158" y="304" width="193" height="20" fill="url(#edgeDark)"/>
  <rect x="177" y="304" width="153" height="19" fill="url(#goldLight)"/>
  <rect x="138" y="324" width="234" height="39" fill="url(#edgeDark)"/>
  <rect x="158" y="344" width="194" height="19" fill="url(#goldLight)"/>
  <rect x="118" y="363" width="274" height="40" fill="url(#goldShadow)"/>
  <rect x="138" y="363" width="232" height="20" fill="url(#goldLight)"/>
</svg>
